[package]
name = "phase"
version = "0.1.0"
edition = "2024"
publish = false
description = "Offline terminal MIDI instrument and interactive piano tutor"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
cpal = "0.18.2"
crossbeam-queue = "0.3.13"
crossterm = "0.29.0"
ctrlc = "3.5.2"
directories = "6.0.0"
midir = "0.11.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.5"
